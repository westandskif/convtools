name: tests

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.sha }}
  cancel-in-progress: ${{ contains(github.ref, 'refs/tags/') }}

jobs:
  run_tests:
    strategy:
      fail-fast: true
      matrix:
        os-python-env:
          - [ubuntu-24.04, "3.8",  "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.9",  "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.10", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.11", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.12", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.13", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.14", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.15", "CONVTOOLS_CEXT_DISABLED=1"]
          - [ubuntu-24.04, "3.15t", "CONVTOOLS_CEXT_DISABLED=0 CONVTOOLS_CEXT_STRICT=1"]
          - [ubuntu-24.04, "3.10", "CONVTOOLS_CEXT_DISABLED=0"]
    runs-on: ${{ matrix.os-python-env[0] }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os-python-env[1] }}

      - name: run tests
        if: ${{ matrix.os-python-env[1] != '3.10' }}
        run: |
          py_ver=${{ matrix.os-python-env[1] }}
          pip install -r ci-requirements/requirements${py_ver%t}.out
          ${{ matrix.os-python-env[2] }} pip install -e .
          pytest --benchmark-skip --no-cov

      - name: check abi3t extension is in use
        if: ${{ matrix.os-python-env[1] == '3.15t' }}
        run: |
          python -c "import sys, convtools._cext as m, convtools._base as b; assert '.abi3t' in m.__file__, m.__file__; assert not sys._is_gil_enabled(); assert b.get_attr_deep_default_simple is not None"

      - name: run tests & lint
        if: ${{ matrix.os-python-env[1] == '3.10' }}
        run: |
          pip install -r ci-requirements/requirements${{ matrix.os-python-env[1] }}.out
          black src tests --check
          isort src tests --check
          ruff check src
          mypy --check-untyped-defs src
          python build-docs-reducers.py --check
          ${{ matrix.os-python-env[2] }} pip install -e .
          pytest --benchmark-skip --no-cov

  build_sdist:
    name: Build source distribution
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - run_tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: upload coverage
        run: |
          pip install -r ci-requirements/requirements3.10.out
          find src/convtools -name "*.so" -delete
          CONVTOOLS_CEXT_DISABLED=1 pip install -e .
          pytest --benchmark-skip
          CONVTOOLS_CEXT_DISABLED=0 pip install -e .
          pytest --benchmark-skip --cov-append
          bash <(curl -s https://codecov.io/bash) -t ${{ secrets.CODECOV_TOKEN }}

      - name: build sdist
        run: |
          pip install -U pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-sdist
          path: ./dist/*.tar.gz

  build_wheels:
    name: Build wheels
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - run_tests
    strategy:
      matrix:
        buildplat:
          - [ubuntu-24.04, manylinux_x86_64]
          - [ubuntu-24.04, musllinux_x86_64]
          - [macos-15-intel, macosx_x86_64]
          - [macos-14, macosx_arm64]
          - [windows-2022, win_amd64]
        py_ver_info:
          - ["310", "~=3.10"]
          - ["314t", "~=3.14"]
          - ["315t", "~=3.15"]
    runs-on: ${{ matrix.buildplat[0] }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: cp${{ matrix.py_ver_info[0] }}-${{ matrix.buildplat[1] }}
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ matrix.py_ver_info[1] }}
          CIBW_ENVIRONMENT: CONVTOOLS_CEXT_STRICT=1
          CIBW_TEST_COMMAND: ${{ matrix.py_ver_info[0] == '315t' && 'python -c "import sys, convtools._cext; assert not sys._is_gil_enabled()"' || '' }}

      # setuptools cannot tag abi3t wheels yet: the extension is built as
      # abi3t (setup.py), so only the wheel tag needs fixing
      - name: Retag cp315t wheels as abi3t
        if: matrix.py_ver_info[0] == '315t'
        shell: bash
        run: |
          shopt -s failglob
          for whl in wheelhouse/*-cp315-cp315t-*.whl; do
            rm -rf unpacked
            pipx run wheel==0.48.0 unpack -d unpacked "$whl"
            if ! compgen -G 'unpacked/*/convtools/_cext.abi3t*.so' >/dev/null \
                && ! compgen -G 'unpacked/*/convtools/_cext*.pyd' >/dev/null; then
              echo "::error::$whl contains no abi3t convtools._cext"
              exit 1
            fi
            pipx run wheel==0.48.0 tags --python-tag cp315 --abi-tag abi3t --remove "$whl"
          done
          rm -rf unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.py_ver_info[0] }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  pypi-publish:
    name: Upload release to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/convtools
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
